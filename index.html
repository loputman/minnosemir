<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMİR | Official</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belleza&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: #0d0d0d;
        }

        /* Arka Plan GIF */
        .bg-gif {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.pinimg.com/originals/75/eb/05/75eb058f53774fa8b5c7cce736ce24d9.gif') no-repeat center center/cover;
            z-index: 1;
            filter: brightness(0.5) contrast(1.1);
        }

        /* Kalp Yağmuru Canvas */
        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Overlay Kaplama */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Giriş Ekranı */
        #enter-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 12, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .enter-btn {
            background: rgba(255, 102, 204, 0.1);
            color: #ff85d4;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            padding: 18px 45px;
            border: 2px solid #ff66cc;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff66cc, inset 0 0 15px rgba(255, 102, 204, 0.3);
            text-shadow: 0 0 12px #ff66cc;
            transition: all 0.4s ease;
        }

        .enter-btn:hover {
            background: #ff66cc;
            color: #fff;
            box-shadow: 0 0 35px #ff66cc, 0 0 60px #ff1493;
            text-shadow: 0 0 10px #fff;
            transform: scale(1.08);
        }

        /* Ana İçerik Kartı */
        .card {
            background: rgba(25, 10, 25, 0.68);
            border: 2px solid rgba(255, 133, 212, 0.45);
            border-radius: 30px;
            padding: 24px 35px;
            text-align: center;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 35px rgba(255, 102, 204, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 92%;
            width: 480px;
            opacity: 0;
            transform: scale(0.85);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .card.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Pembe Tatlı EMİR Logosu */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-heart {
            font-size: 2.5rem;
            animation: heartPulse 1.5s infinite ease-in-out alternate;
        }

        @keyframes heartPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ff66cc); }
            100% { transform: scale(1.2); filter: drop-shadow(0 0 15px #ff1493); }
        }

        /* Belleza Fontu */
        .logo-text {
            font-family: 'Belleza', sans-serif;
            font-size: 4.5rem;
            letter-spacing: 8px;
            line-height: 1;
            display: flex;
            font-weight: 400;
            text-transform: uppercase;
        }

        .led-letter {
            color: #ffb3e6;
            animation: ledBlink 1.8s infinite ease-in-out;
        }

        .led-letter:nth-child(1) { animation-delay: 0.0s; }
        .led-letter:nth-child(2) { animation-delay: 0.35s; }
        .led-letter:nth-child(3) { animation-delay: 0.7s; }
        .led-letter:nth-child(4) { animation-delay: 1.05s; }

        @keyframes ledBlink {
            0%, 100% { color: #552040; text-shadow: none; }
            35%, 65% {
                color: #ffffff;
                text-shadow: 0 0 5px #fff, 0 0 12px #ff85d4, 0 0 25px #ff66cc, 0 0 45px #ff1493;
            }
        }

        .sub-quote {
            color: #ffb3e6;
            font-size: 0.95rem;
            font-weight: 600;
            font-style: italic;
            letter-spacing: 0.5px;
            line-height: 1.4;
            text-shadow: 0 0 8px rgba(255, 102, 204, 0.8);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* --- GERÇEKÇİ ÇİKOLATALI KURABİYE ALANI --- */
        .cookie-game-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1.5px dashed rgba(255, 102, 204, 0.5);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            min-height: 180px;
            justify-content: center;
        }

        .game-instruction {
            color: #ff85d4;
            font-size: 0.85rem;
            font-weight: bold;
            text-shadow: 0 0 5px #ff66cc;
            transition: opacity 0.3s ease;
        }

        /* Kurabiye Görsel Wrapper */
        .cookie-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            cursor: pointer;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 0 10px rgba(255, 102, 204, 0.3));
        }

        .cookie-wrapper:hover {
            transform: scale(1.08);
        }

        /* Tam Kurabiye Katmanı (İlk Görünüm) */
        .cookie-full {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #e8a85c, #bd7024, #87490e);
            box-shadow: inset -3px -3px 8px rgba(0, 0, 0, 0.4), inset 3px 3px 8px rgba(255, 255, 255, 0.2);
            z-index: 3;
            transition: opacity 0.2s ease;
        }

        /* Çikolata Parçacıkları (Chocolate Chips) */
        .chip {
            position: absolute;
            background: #361908;
            border-radius: 40% 60% 70% 30% / 50% 60% 40% 50%;
            box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.3), 1px 1px 3px rgba(0, 0, 0, 0.6);
        }

        /* Tam Kurabiye Üzerindeki Çikolatalar */
        .cookie-full .chip-1 { width: 11px; height: 11px; top: 22px; left: 24px; }
        .cookie-full .chip-2 { width: 13px; height: 10px; top: 68px; left: 18px; }
        .cookie-full .chip-3 { width: 9px; height: 12px; top: 45px; left: 38px; }
        .cookie-full .chip-4 { width: 10px; height: 9px; top: 85px; left: 32px; }
        .cookie-full .chip-5 { width: 12px; height: 11px; top: 25px; right: 22px; }
        .cookie-full .chip-6 { width: 10px; height: 13px; top: 65px; right: 25px; }
        .cookie-full .chip-7 { width: 11px; height: 9px; top: 42px; right: 40px; }

        /* Kırılma Parçaları */
        .cookie-half {
            position: absolute;
            width: 55px;
            height: 110px;
            background: radial-gradient(circle at 30% 30%, #e8a85c, #bd7024, #87490e);
            box-shadow: inset -3px -3px 8px rgba(0, 0, 0, 0.4), inset 3px 3px 8px rgba(255, 255, 255, 0.2);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            top: 0;
            overflow: hidden;
            z-index: 2;
        }

        .cookie-left {
            left: 0;
            border-radius: 110px 0 0 110px;
            clip-path: polygon(0% 0%, 100% 0%, 85% 25%, 100% 50%, 80% 75%, 100% 100%, 0% 100%);
        }

        .cookie-right {
            right: 0;
            border-radius: 0 110px 110px 0;
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 15% 75%, 0% 50%, 15% 25%);
            background: radial-gradient(circle at 70% 30%, #e8a85c, #bd7024, #87490e);
        }

        /* Parça Çikolataları */
        .cookie-left .chip-1 { width: 10px; height: 10px; top: 20px; left: 20px; }
        .cookie-left .chip-2 { width: 12px; height: 9px; top: 65px; left: 15px; }
        .cookie-left .chip-3 { width: 8px; height: 11px; top: 42px; left: 32px; }
        .cookie-left .chip-4 { width: 9px; height: 8px; top: 88px; left: 28px; }

        .cookie-right .chip-1 { width: 11px; height: 10px; top: 25px; right: 18px; }
        .cookie-right .chip-2 { width: 9px; height: 12px; top: 70px; right: 22px; }
        .cookie-right .chip-3 { width: 12px; height: 9px; top: 48px; right: 30px; }
        .cookie-right .chip-4 { width: 8px; height: 8px; top: 85px; right: 12px; }

        /* Kırılma Efekti Sınıfları */
        .cookie-wrapper.broken .cookie-full {
            opacity: 0;
            pointer-events: none;
        }

        .cookie-wrapper.broken .cookie-left {
            transform: translateX(-50px) rotate(-28deg);
            opacity: 0.85;
        }

        .cookie-wrapper.broken .cookie-right {
            transform: translateX(50px) rotate(28deg);
            opacity: 0.85;
        }

        /* İçinden Çıkan Şans Kağıdı */
        .fortune-paper {
            position: absolute;
            background: #fff0f5;
            color: #8b004b;
            border: 2px solid #ff66cc;
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 0.88rem;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(255, 102, 204, 0.8);
            max-width: 90%;
            text-align: center;
            opacity: 0;
            transform: scale(0.2) translateY(20px);
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 5;
        }

        .fortune-paper.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .reset-btn {
            background: #ff66cc;
            color: #fff;
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
            box-shadow: 0 0 8px #ff66cc;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .reset-btn:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        /* Sosyal Medya İkonları */
        .social-links {
            display: flex;
            gap: 20px;
        }

        .social-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid #ff66cc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff66cc;
            font-size: 1.3rem;
            text-decoration: none;
            box-shadow: 0 0 10px #ff66cc;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.35);
        }

        .social-btn:hover {
            background: #ff66cc;
            color: #fff;
            box-shadow: 0 0 25px #ff66cc, 0 0 40px #ff1493;
            transform: translateY(-4px) scale(1.1);
        }

        /* Pembe Neon Saat & Tarih */
        .clock-container {
            margin-top: 2px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 102, 204, 0.2);
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 0.82rem;
            color: #ff85d4;
            font-weight: 700;
            text-shadow: 0 0 6px #ff66cc;
            letter-spacing: 1px;
        }

        /* Müzik Kontrol Butonu */
        .music-btn {
            background: rgba(255, 102, 204, 0.15);
            color: #ff85d4;
            border: 1px solid #ff66cc;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 102, 204, 0.3);
            text-shadow: 0 0 5px #ff66cc;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .music-btn:hover {
            background: #ff66cc;
            color: #fff;
            box-shadow: 0 0 15px #ff66cc;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="bg-gif"></div>
    <canvas id="heartCanvas"></canvas>

    <audio id="bg-music" loop src="https://cdn.imageurlgenerator.com/uploads/fb7a96f4-e50c-4a79-bb36-4238cd234f42.mp3"></audio>

    <div id="enter-screen">
        <button class="enter-btn" onclick="enterSite()">
            <i class="fa-solid fa-heart" style="margin-right: 10px;"></i> SİTEYE GİR <i class="fa-solid fa-heart" style="margin-left: 10px;"></i>
        </button>
    </div>

    <div class="overlay">
        <div class="card" id="main-card">
            
            <div class="logo-container">
                <span class="logo-heart">💖</span>
                <div class="logo-text">
                    <span class="led-letter">E</span>
                    <span class="led-letter">M</span>
                    <span class="led-letter">İ</span>
                    <span class="led-letter">R</span>
                </div>
                <span class="logo-heart">💖</span>
            </div>

            <div class="sub-quote">
                <span>🌸 her şeyin güzel olduğu dünyada, ✨</span>
                <span>💕 sen ışığınla fark yarat 🌸</span>
            </div>

            <!-- Çikolatalı Gerçekçi Kurabiye Oyunu -->
            <div class="cookie-game-container">
                <div class="game-instruction" id="cookieHint">Kurabiyeyi kırmak için üzerine tıkla! 🍪</div>
                
                <div class="cookie-wrapper" id="cookieObj" onclick="breakCookie()">
                    <!-- Kırılmamış Tam Kurabiye Katmanı -->
                    <div class="cookie-full">
                        <div class="chip chip-1"></div>
                        <div class="chip chip-2"></div>
                        <div class="chip chip-3"></div>
                        <div class="chip chip-4"></div>
                        <div class="chip chip-5"></div>
                        <div class="chip chip-6"></div>
                        <div class="chip chip-7"></div>
                    </div>

                    <!-- Kırılma Parçaları -->
                    <div class="cookie-half cookie-left">
                        <div class="chip chip-1"></div>
                        <div class="chip chip-2"></div>
                        <div class="chip chip-3"></div>
                        <div class="chip chip-4"></div>
                    </div>
                    <div class="cookie-half cookie-right">
                        <div class="chip chip-1"></div>
                        <div class="chip chip-2"></div>
                        <div class="chip chip-3"></div>
                        <div class="chip chip-4"></div>
                    </div>
                </div>

                <div class="fortune-paper" id="fortunePaper">
                    <span id="paperText">...</span>
                    <br>
                    <button class="reset-btn" onclick="resetCookie()">Yeniden Kır 🍪</button>
                </div>
            </div>
            
            <div class="social-links">
                <a href="https://steamcommunity.com/id/Emir0x0409/" target="_blank" class="social-btn" title="Steam">
                    <i class="fa-brands fa-steam"></i>
                </a>
                <a href="https://www.instagram.com/emir_0x0409" target="_blank" class="social-btn" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>

            <div class="clock-container">
                <span id="live-date">00.00.0000</span>
                <span>•</span>
                <span id="live-time">00:00:00</span>
            </div>

            <!-- Müzik Kontrol Butonu -->
            <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">
                <i class="fa-solid fa-volume-high" id="musicIcon"></i>
                <span id="musicBtnText">Müziği Durdur</span>
            </button>

        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        let isPlaying = false;

        function enterSite() {
            const enterScreen = document.getElementById('enter-screen');
            const mainCard = document.getElementById('main-card');

            enterScreen.style.opacity = '0';
            enterScreen.style.visibility = 'hidden';

            music.play().then(() => {
                isPlaying = true;
                updateMusicBtnUI();
            }).catch(err => console.log("Müzik başlatılamadı: ", err));

            setTimeout(() => {
                mainCard.classList.add('active');
            }, 300);
        }

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                isPlaying = false;
            } else {
                music.play();
                isPlaying = true;
            }
            updateMusicBtnUI();
        }

        function updateMusicBtnUI() {
            const musicIcon = document.getElementById('musicIcon');
            const musicBtnText = document.getElementById('musicBtnText');

            if (isPlaying) {
                musicIcon.className = 'fa-solid fa-volume-high';
                musicBtnText.innerText = 'Müziği Durdur';
            } else {
                musicIcon.className = 'fa-solid fa-volume-xmark';
                musicBtnText.innerText = 'Müziği Başlat';
            }
        }

        function updateClock() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('live-date').innerText = `${day}.${month}.${year}`;
            document.getElementById('live-time').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 25 Farklı Şans Mesajı
        const cookieNotes = [
            "Gülüşün bugün birinin modunu yükseltecek! 😊✨",
            "Bugün beklemediğin tatlı bir haber var! 💌💖",
            "Yıldızlar senin tarafında, ne dilersen kabul olsun! 🌟🎀",
            "Bugün kendine zaman ayır ve parlamaya devam et! 👑🌸",
            "Bugün etrafına saçacağın enerji paha biçilemez! 💕💫",
            "Hayallerin düşündüğünden çok daha yakın, devam et! 🚀✨",
            "Bugün sana özel minik bir sürpriz kapıda olabilir! 🎁💖",
            "Enerjinle girdiğin her ortamı aydınlatıyorsun! 💫🌸",
            "Güzel düşünceler, güzel sürprizleri beraberinde getirir! ✨🎀",
            "Bugün senin günün, harika işler başaracaksın! 👑💫",
            "Kalbinin güzelliği yüzüne yansıyor, bunu unutma! 🌸✨",
            "Bugün birine gülümsediğinde dünyası değişebilir! 💖😊",
            "Modunu yüksek tut, şans bugün tamamen senden yana! 🎲💗",
            "Kendi yolunda emin adımlarla ilerliyorsun, tebrikler! 🌈✨",
            "Hayatındaki tatlı tesadüflere hazır ol! 💌🌸",
            "Etrafına yaydığın pozitif ışık sana katlanarak dönecek! ✨💖",
            "Kendine inanmak için bundan daha güzel bir gün olamaz! 👑🌸",
            "Bugün bir kahve iç ve anın tadını çıkar! ☕✨",
            "İçindeki potansiyel her geçen gün daha da parlıyor! 🌟💗",
            "Ufak bir adım bile büyük mucizeler getirebilir! 🐾✨",
            "Bugün günün en şanslı kişisi sen olabilirsin! 🍀💖",
            "Kararlılığın seni istediğin her yere götürür! 💫🌸",
            "Senin varlığın etrafındakiler için büyük bir hediye! 🎁💖",
            "Bugün tüm olumsuzlukları geride bırakma günü! 🌈✨",
            "Işığını hiçbir şeyin söndürmesine izin verme! 🌟🌸"
        ];

        let lastIndex = -1;
        let isBroken = false;

        function breakCookie() {
            if (isBroken) return;
            isBroken = true;

            const cookieObj = document.getElementById('cookieObj');
            const fortunePaper = document.getElementById('fortunePaper');
            const paperText = document.getElementById('paperText');
            const cookieHint = document.getElementById('cookieHint');

            // Kurabiyeyi Çatlat
            cookieObj.classList.add('broken');
            cookieHint.style.opacity = '0';

            // Rastgele mesaj seç
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * cookieNotes.length);
            } while (randomIndex === lastIndex);
            lastIndex = randomIndex;

            // Kağıdı çıkar
            setTimeout(() => {
                paperText.innerText = cookieNotes[randomIndex];
                fortunePaper.classList.add('show');
            }, 300);
        }

        function resetCookie() {
            const cookieObj = document.getElementById('cookieObj');
            const fortunePaper = document.getElementById('fortunePaper');
            const cookieHint = document.getElementById('cookieHint');

            fortunePaper.classList.remove('show');

            setTimeout(() => {
                cookieObj.classList.remove('broken');
                cookieHint.style.opacity = '1';
                isBroken = false;
            }, 400);
        }

        // --- İDEAL BOYUTTA KALP YAĞMURU CANVAS ---
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let hearts = [];
        const mouse = { x: null, y: null };

        class Heart {
            constructor(x, y, isMouse = false, randomStart = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || (randomStart ? Math.random() * canvas.height : -25);
                // İdeal orta boyut (12px - 18px arası)
                this.size = isMouse ? Math.random() * 8 + 6 : Math.random() * 8 + 12;
                this.speedY = isMouse ? (Math.random() - 0.5) * 1.5 + 0.8 : Math.random() * 1.4 + 1.0;
                this.speedX = (Math.random() - 0.5) * 1.4;
                this.opacity = isMouse ? 0.9 : Math.random() * 0.4 + 0.45;
                this.fade = isMouse ? Math.random() * 0.02 + 0.015 : 0;
                this.color = `hsl(${Math.random() * 30 + 325}, 95%, ${Math.random() * 15 + 68}%)`;
                this.isMouse = isMouse;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff33b5';
                ctx.beginPath();
                const topCurveHeight = this.size * 0.3;
                ctx.moveTo(this.x, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x, this.y + this.size, this.x, this.y + this.size);
                ctx.bezierCurveTo(this.x, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + topCurveHeight, this.x + this.size / 2, this.y);
                ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + topCurveHeight);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.isMouse) {
                    this.opacity -= this.fade;
                } else {
                    if (this.y > canvas.height + 25) {
                        this.y = -25;
                        this.x = Math.random() * canvas.width;
                        this.opacity = Math.random() * 0.4 + 0.45;
                    }
                }
            }
        }

        // 55 adet ideal boyutta kalp ekranda dengeli akar
        for (let i = 0; i < 55; i++) {
            hearts.push(new Heart(null, null, false, true));
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            for (let i = 0; i < 2; i++) {
                hearts.push(new Heart(mouse.x, mouse.y, true));
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < hearts.length; i++) {
                hearts[i].update();
                hearts[i].draw();

                if (hearts[i].isMouse && hearts[i].opacity <= 0) {
                    hearts.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
