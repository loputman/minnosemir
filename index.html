<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMİR'in Dünyası</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belleza&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<!-- Sekme Kalp İkonu (Favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: #0d0d0d;
        }

        /* Arka Plan GIF */
        .bg-gif {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.pinimg.com/originals/75/eb/05/75eb058f53774fa8b5c7cce736ce24d9.gif') no-repeat center center/cover;
            z-index: 1;
            filter: brightness(0.5) contrast(1.1);
        }

        /* Kalp & Kelebek Canvas */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Overlay Kaplama */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Giriş Ekranı */
        #enter-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 12, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .enter-btn {
            background: rgba(255, 102, 204, 0.1);
            color: #ff85d4;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            padding: 18px 45px;
            border: 2px solid #ff66cc;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff66cc, inset 0 0 15px rgba(255, 102, 204, 0.3);
            text-shadow: 0 0 12px #ff66cc;
            transition: all 0.4s ease;
        }

        .enter-btn:hover {
            background: #ff66cc;
            color: #fff;
            box-shadow: 0 0 35px #ff66cc, 0 0 60px #ff1493;
            text-shadow: 0 0 10px #fff;
            transform: scale(1.08);
        }

        /* Ana İçerik Kartı */
        .card {
            background: rgba(25, 10, 25, 0.68);
            border: 2px solid rgba(255, 133, 212, 0.45);
            border-radius: 30px;
            padding: 24px 35px;
            text-align: center;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 35px rgba(255, 102, 204, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 92%;
            width: 480px;
            opacity: 0;
            transform: scale(0.85);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .card.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Pembe Tatlı EMİR Logosu */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-heart {
            font-size: 2.5rem;
            animation: heartPulse 1.5s infinite ease-in-out alternate;
        }

        @keyframes heartPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ff66cc); }
            100% { transform: scale(1.2); filter: drop-shadow(0 0 15px #ff1493); }
        }

        .logo-text {
            font-family: 'Belleza', sans-serif;
            font-size: 4.5rem;
            letter-spacing: 8px;
            line-height: 1;
            display: flex;
            font-weight: 400;
            text-transform: uppercase;
        }

        .led-letter {
            color: #ffb3e6;
            animation: ledBlink 1.0s infinite ease-in-out;
        }

        .led-letter:nth-child(1) { animation-delay: 0.0s; }
        .led-letter:nth-child(2) { animation-delay: 0.2s; }
        .led-letter:nth-child(3) { animation-delay: 0.4s; }
        .led-letter:nth-child(4) { animation-delay: 0.6s; }

        @keyframes ledBlink {
            0%, 100% { color: #552040; text-shadow: none; }
            35%, 65% {
                color: #ffffff;
                text-shadow: 0 0 5px #fff, 0 0 12px #ff85d4, 0 0 25px #ff66cc, 0 0 45px #ff1493;
            }
        }

        .sub-quote {
            color: #ffb3e6;
            font-size: 0.98rem;
            font-weight: 700;
            font-style: italic;
            letter-spacing: 0.5px;
            line-height: 1.4;
            text-shadow: 0 0 10px rgba(255, 102, 204, 0.9);
            white-space: nowrap;
        }

        /* --- 🖼️ GIF ALANI (Eski oyun yerinde) --- */
        .gif-box-container {
            width: 100%;
            background: rgba(10, 0, 15, 0.4);
            border: 1.5px solid rgba(255, 102, 204, 0.4);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(255, 102, 204, 0.2), 0 0 20px rgba(255, 102, 204, 0.15);
            overflow: hidden;
        }

        .custom-gif {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid rgba(255, 133, 212, 0.5);
            box-shadow: 0 0 15px rgba(255, 102, 204, 0.3);
        }

        /* Sosyal Medya İkonları */
        .social-links {
            display: flex;
            gap: 20px;
        }

        .social-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid #ff66cc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff66cc;
            font-size: 1.3rem;
            text-decoration: none;
            box-shadow: 0 0 10px #ff66cc;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.35);
        }

        .social-btn:hover {
            background: #ff66cc;
            color: #fff;
            box-shadow: 0 0 25px #ff66cc, 0 0 40px #ff1493;
            transform: translateY(-4px) scale(1.1);
        }

        /* Pembe Neon Saat & Tarih */
        .clock-container {
            margin-top: 2px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 102, 204, 0.2);
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 0.82rem;
            color: #ff85d4;
            font-weight: 700;
            text-shadow: 0 0 6px #ff66cc;
            letter-spacing: 1px;
        }

        /* Müzik Kontrol Butonu */
        .music-btn {
            background: rgba(255, 102, 204, 0.15);
            color: #ff85d4;
            border: 1px solid #ff66cc;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 102, 204, 0.3);
            text-shadow: 0 0 5px #ff66cc;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .music-btn:hover {
            background: #ff66cc;
            color: #fff;
            box-shadow: 0 0 15px #ff66cc;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="bg-gif"></div>
    <canvas id="particleCanvas"></canvas>

    <audio id="bg-music" loop src="https://cdn.imageurlgenerator.com/uploads/fb7a96f4-e50c-4a79-bb36-4238cd234f42.mp3"></audio>

    <div id="enter-screen">
        <button class="enter-btn" onclick="enterSite()">
            <i class="fa-solid fa-heart" style="margin-right: 10px;"></i> SİTEYE GİR <i class="fa-solid fa-heart" style="margin-left: 10px;"></i>
        </button>
    </div>

    <div class="overlay">
        <div class="card" id="main-card">
            
            <div class="logo-container">
                <span class="logo-heart">💖</span>
                <div class="logo-text">
                    <span class="led-letter">E</span>
                    <span class="led-letter">M</span>
                    <span class="led-letter">İ</span>
                    <span class="led-letter">R</span>
                </div>
                <span class="logo-heart">💖</span>
            </div>

            <div class="sub-quote">
                🌟 Işığını hiçbir şeyin söndürmesine izin verme! 🌸
            </div>

            <!-- 🖼️ ÖZEL GIF ALANI -->
            <div class="gif-box-container">
                <img src="https://cdn.imageurlgenerator.com/uploads/dd87cf48-d185-4d8a-8e4e-f5860d50f828.gif" alt="Special GIF" class="custom-gif">
            </div>
            
            <div class="social-links">
                <a href="https://steamcommunity.com/id/Emir0x0409/" target="_blank" class="social-btn" title="Steam">
                    <i class="fa-brands fa-steam"></i>
                </a>
                <a href="https://www.instagram.com/emir_0x0409" target="_blank" class="social-btn" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>

            <div class="clock-container">
                <span id="live-date">00.00.0000</span>
                <span>•</span>
                <span id="live-time">00:00:00</span>
            </div>

            <!-- Müzik Kontrol Butonu -->
            <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">
                <i class="fa-solid fa-volume-high" id="musicIcon"></i>
                <span id="musicBtnText">Müziği Durdur</span>
            </button>

        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        let isPlaying = false;

        function enterSite() {
            const enterScreen = document.getElementById('enter-screen');
            const mainCard = document.getElementById('main-card');

            enterScreen.style.opacity = '0';
            enterScreen.style.visibility = 'hidden';

            music.play().then(() => {
                isPlaying = true;
                updateMusicBtnUI();
            }).catch(err => console.log("Müzik başlatılamadı: ", err));

            setTimeout(() => {
                mainCard.classList.add('active');
            }, 300);
        }

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                isPlaying = false;
            } else {
                music.play();
                isPlaying = true;
            }
            updateMusicBtnUI();
        }

        function updateMusicBtnUI() {
            const musicIcon = document.getElementById('musicIcon');
            const musicBtnText = document.getElementById('musicBtnText');

            if (isPlaying) {
                musicIcon.className = 'fa-solid fa-volume-high';
                musicBtnText.innerText = 'Müziği Durdur';
            } else {
                musicIcon.className = 'fa-solid fa-volume-xmark';
                musicBtnText.innerText = 'Müziği Başlat';
            }
        }

        function updateClock() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('live-date').innerText = `${day}.${month}.${year}`;
            document.getElementById('live-time').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- KALP VE RASTGELE SÜZÜLEN KELEBEK CANVAS ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const mouse = { x: null, y: null };

        // Kalp Sınıfı
        class Heart {
            constructor(x, y, isMouse = false, randomStart = false) {
                this.type = 'heart';
                this.x = x || Math.random() * canvas.width;
                this.y = y || (randomStart ? Math.random() * canvas.height : -25);
                this.size = isMouse ? Math.random() * 8 + 6 : Math.random() * 8 + 12;
                this.speedY = isMouse ? (Math.random() - 0.5) * 1.5 + 0.8 : Math.random() * 1.4 + 1.0;
                this.speedX = (Math.random() - 0.5) * 1.4;
                this.opacity = isMouse ? 0.9 : Math.random() * 0.4 + 0.45;
                this.fade = isMouse ? Math.random() * 0.02 + 0.015 : 0;
                this.color = `hsl(${Math.random() * 30 + 325}, 95%, ${Math.random() * 15 + 68}%)`;
                this.isMouse = isMouse;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff33b5';
                ctx.beginPath();
                const topCurveHeight = this.size * 0.3;
                ctx.moveTo(this.x, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x, this.y + this.size, this.x, this.y + this.size);
                ctx.bezierCurveTo(this.x, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + topCurveHeight, this.x + this.size / 2, this.y);
                ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + topCurveHeight);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.isMouse) {
                    this.opacity -= this.fade;
                } else {
                    if (this.y > canvas.height + 25) {
                        this.y = -25;
                        this.x = Math.random() * canvas.width;
                        this.opacity = Math.random() * 0.4 + 0.45;
                    }
                }
            }
        }

        // Serbest Gezen Kelebek Sınıfı
        class Butterfly {
            constructor() {
                this.type = 'butterfly';
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 6 + 10;
                this.speedX = (Math.random() - 0.5) * 2.5;
                this.speedY = (Math.random() - 0.5) * 2.5;
                this.angle = Math.atan2(this.speedY, this.speedX);
                this.wingAngle = 0;
                this.wingSpeed = Math.random() * 0.2 + 0.15;
                this.opacity = Math.random() * 0.4 + 0.6;
                this.color = `hsl(${Math.random() * 30 + 325}, 95%, ${Math.random() * 15 + 68}%)`;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle + Math.PI / 2);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff66cc';

                const wingScale = Math.sin(this.wingAngle);

                ctx.beginPath();
                ctx.ellipse(-this.size * 0.6 * Math.abs(wingScale), -this.size * 0.3, this.size * 0.7 * Math.abs(wingScale), this.size * 0.4, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(this.size * 0.6 * Math.abs(wingScale), -this.size * 0.3, this.size * 0.7 * Math.abs(wingScale), this.size * 0.4, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-1, -this.size * 0.5, 2, this.size);

                ctx.restore();
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.wingAngle += this.wingSpeed;

                if (Math.random() < 0.03) {
                    this.speedX += (Math.random() - 0.5) * 1.0;
                    this.speedY += (Math.random() - 0.5) * 1.0;
                    
                    this.speedX = Math.max(-2, Math.min(2, this.speedX));
                    this.speedY = Math.max(-2, Math.min(2, this.speedY));
                    
                    this.angle = Math.atan2(this.speedY, this.speedX);
                }

                if (this.x < 10 || this.x > canvas.width - 10) this.speedX *= -1;
                if (this.y < 10 || this.y > canvas.height - 10) this.speedY *= -1;
            }
        }

        for (let i = 0; i < 40; i++) {
            particles.push(new Heart(null, null, false, true));
        }

        for (let i = 0; i < 18; i++) {
            particles.push(new Butterfly());
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            for (let i = 0; i < 2; i++) {
                particles.push(new Heart(mouse.x, mouse.y, true));
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].isMouse && particles[i].opacity <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
